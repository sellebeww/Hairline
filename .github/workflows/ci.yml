name: ci
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: cd packages/hairline_core && dart pub get && dart analyze --fatal-infos && dart test --coverage=coverage
      - run: python3 tools/audit/doc_checks.py

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cd app && flutter pub get && dart run build_runner build --delete-conflicting-outputs
      - run: cd app && flutter analyze && flutter test

  # NOT YET PROVEN (BLOCKERS B1): the native OpenCV build was never run successfully; this job is
  # the first attempt on Linux. Until it is green the adapter tests count as "written, not run".
  opencv:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - run: cd packages/hairline_opencv && flutter pub get && flutter analyze && flutter test
