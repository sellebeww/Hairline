name: opencv_spike
description: Phase 1 spike for opencv_dart (ArUco, JPEG decode, ROI). Not shipped.
publish_to: none
# Copyright (c) 2026 Vassel Goleyu. MIT License.

environment:
  sdk: ^3.13.4
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  opencv_dart: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# macos override: the default Xcode generator needs full Xcode. See docs/SPIKE_OPENCV.md.
hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgproc
        - imgcodecs
        - calib3d
        - objdetect
        - aruco
      macos:
        generator: Ninja
